<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140">
  <!-- Icon badge -->
  <circle cx="70" cy="70" r="55" fill="#4F46E5"/>

  <!-- Books on shelves -->
  <g fill="#ffffff">
    <!-- Top shelf: 7 books of varied heights -->
    <rect x="37" y="38" width="6" height="20" rx="1"/>
    <rect x="46" y="33" width="7" height="25" rx="1"/>
    <rect x="56" y="40" width="5" height="18" rx="1"/>
    <rect x="64" y="36" width="8" height="22" rx="1"/>
    <rect x="75" y="38" width="6" height="20" rx="1"/>
    <rect x="84" y="33" width="7" height="25" rx="1"/>
    <rect x="94" y="40" width="5" height="18" rx="1"/>
    <!-- Top shelf line -->
    <rect x="35" y="59" width="68" height="3" rx="1.5"/>

    <!-- Bottom shelf: 7 books of varied heights -->
    <rect x="37" y="68" width="7" height="22" rx="1"/>
    <rect x="47" y="72" width="5" height="18" rx="1"/>
    <rect x="55" y="66" width="8" height="24" rx="1"/>
    <rect x="66" y="70" width="6" height="20" rx="1"/>
    <rect x="75" y="68" width="7" height="22" rx="1"/>
    <rect x="85" y="72" width="5" height="18" rx="1"/>
    <rect x="93" y="68" width="7" height="22" rx="1"/>
    <!-- Bottom shelf line -->
    <rect x="35" y="91" width="68" height="3" rx="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="155" y="94"
        font-family="'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="62"
        fill="#4F46E5"
        letter-spacing="-1.5">vscode-shelf</text>
</svg>
